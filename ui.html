<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicGang</title>
<style>
  /* ------------------------------------------------------------------ */
  /* Design: three columns on black. Left = queue, centre = player,      */
  /* right = search. Pills and a white play button, no borders except   */
  /* the two 1px column dividers.                                        */
  /*                                                                     */
  /* Sizes use clamp()/vw/vh so the same page works from a 1080p-wide   */
  /* window down to a narrow one. Below 1000px wide the columns stack:  */
  /* player on top, queue + search side by side; below 640px, single    */
  /* column.                                                             */
  /* ------------------------------------------------------------------ */
  :root {
    --bg: #000;
    --panel: #1f1f1f;
    --line: #262626;
    --fg: #fff;
    --muted: #a3a3a3;
    --dim: #6b6b6b;
    --pill: #1c1c1c;
    --pill-hover: #2a2a2a;
    --danger: #3a1515;
    --danger-fg: #ff7b7b;
    --ok: #3ddc84;
    --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    --pad: clamp(16px, 2.6vw, 42px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 4px; }

  .app { display: grid; grid-template-columns: minmax(280px, 27%) 1fr minmax(300px, 27%); height: 100vh; }
  .col { padding: clamp(18px, 3vh, 36px) var(--pad); overflow-y: auto; min-width: 0; }
  .left { border-right: 1px solid var(--line); }
  .right { border-left: 1px solid var(--line); }

  h1 { font-size: clamp(20px, 2vw, 28px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 clamp(16px, 3vh, 40px) 0; }

  /* ---- Up next ---- */
  .qhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: clamp(14px, 2.5vh, 36px); }
  .qhead b { font-size: 16px; font-weight: 600; }
  .qhead button { color: var(--muted); font-size: 16px; }
  .qhead button:hover { color: var(--fg); }
  .empty { color: var(--muted); font-size: clamp(15px, 1.2vw, 18px); line-height: 1.5; }
  .qitem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .qitem .n { color: var(--dim); width: 22px; text-align: right; font-size: 14px; flex: none; }
  .qitem img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--panel); flex: none; }
  .qitem .t { flex: 1; min-width: 0; }
  .qitem .t div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .qitem .t div:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem .d { color: var(--muted); font-size: 13px; flex: none; }
  .qitem .x { color: var(--dim); font-size: 20px; line-height: 1; padding: 4px 6px; border-radius: 6px; flex: none; }
  .qitem .x:hover { color: var(--fg); background: var(--pill-hover); }

  /* ---- Player ---- */
  .center { display: flex; flex-direction: column; align-items: center; padding-top: clamp(16px, 3vh, 40px); }
  /* Never let flex squash the children when the column is taller than the
     window — it scrolls instead. Without this the title/sub get clipped. */
  .center > * { flex: none; }
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: clamp(13px, 1vw, 16px); display: flex; align-items: center; gap: 8px; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; flex: none; }
  .status.on i { background: var(--ok); } .status.bad i { background: var(--danger-fg); }
  .output { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: clamp(14px, 1.1vw, 18px); }
  .select { position: relative; }
  .select select {
    appearance: none; background: var(--bg); color: var(--fg); border: 1px solid #2b2b2b; border-radius: 14px;
    padding: clamp(9px, 1vh, 14px) 40px clamp(9px, 1vh, 14px) 20px; font-size: clamp(14px, 1.1vw, 18px); font-weight: 500;
    cursor: pointer; max-width: 240px; }
  .select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--fg); border-bottom: 2px solid var(--fg); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .join { background: var(--pill); border-radius: 12px; padding: clamp(9px, 1vh, 14px) 18px; font-size: clamp(14px, 1.1vw, 18px); font-weight: 500; }
  .join:hover { background: var(--pill-hover); }

  .art { width: min(445px, 38vh, 70%); aspect-ratio: 1; border-radius: clamp(20px, 3vw, 48px); background: var(--panel);
    margin-top: clamp(16px, 4vh, 52px); display: grid; place-items: center; overflow: hidden; flex: none; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .art svg { width: 36%; height: 36%; }
  .art.has img { display: block; } .art.has svg { display: none; }

  /* line-height 1.3: with overflow hidden, a tighter line clips ascenders. */
  .title { font-size: clamp(22px, 2.6vw, 40px); font-weight: 700; letter-spacing: -0.02em; margin-top: clamp(14px, 2.5vh, 30px);
    text-align: center; max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .sub { color: var(--muted); font-size: clamp(14px, 1.3vw, 20px); margin-top: 6px; text-align: center; max-width: 92%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

  .bar { width: min(690px, 86%); margin-top: clamp(14px, 2.5vh, 32px); cursor: pointer; padding: 8px 0; }
  .bar .track { height: 5px; background: #2b2b2b; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--fg); border-radius: 3px; transition: width .4s linear; }
  .times { width: min(690px, 86%); display: flex; justify-content: space-between; color: var(--muted); font-size: clamp(13px, 1.1vw, 17px); margin-top: 2px; }

  .controls { display: flex; align-items: center; gap: clamp(24px, 3vw, 48px); margin-top: clamp(14px, 3vh, 36px); }
  .controls button { color: var(--fg); display: grid; place-items: center; }
  .controls .side svg { width: clamp(22px, 1.8vw, 28px); height: clamp(22px, 1.8vw, 28px); }
  .controls .side { opacity: .9; } .controls .side:hover { opacity: 1; }
  .play { width: clamp(72px, 7vw, 112px); height: clamp(72px, 7vw, 112px); border-radius: 50%; background: var(--fg); }
  .play svg { width: 34%; height: 34%; fill: #000; }
  .play:hover { transform: scale(1.03); }

  .pills { display: flex; gap: 10px; margin-top: clamp(14px, 3vh, 36px); flex-wrap: wrap; justify-content: center; }
  .pill { background: var(--pill); border-radius: 999px; padding: clamp(11px, 1.6vh, 18px) clamp(16px, 1.8vw, 28px);
    font-size: clamp(14px, 1.15vw, 18px); font-weight: 500; color: var(--fg); white-space: nowrap; }
  .pill:hover { background: var(--pill-hover); }
  .pill.on { background: var(--fg); color: #000; }
  .pill.danger { background: var(--danger); color: var(--danger-fg); }
  .pill.danger:hover { background: #4d1a1a; }

  .vol { display: flex; align-items: center; gap: 16px; margin-top: clamp(14px, 2.5vh, 30px); margin-bottom: 12px; color: var(--muted); font-size: clamp(14px, 1.15vw, 18px); }
  .vol input[type=range] { -webkit-appearance: none; width: clamp(140px, 14vw, 200px); height: 6px; background: #2b2b2b; border-radius: 3px; outline: none; }
  .vol input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); cursor: pointer; }
  .vol b { color: var(--fg); font-weight: 500; min-width: 44px; }

  /* ---- Search ---- */
  .search { display: flex; align-items: center; background: #1c1c1c; border: 1px solid #2b2b2b; border-radius: 999px;
    padding: 8px 8px 8px clamp(16px, 1.6vw, 30px); gap: 10px; }
  .search svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: clamp(15px, 1.2vw, 20px); color: var(--fg); }
  .search input::placeholder { color: var(--muted); }
  .search button { background: var(--fg); color: #000; border-radius: 999px; padding: clamp(10px, 1.4vh, 16px) clamp(16px, 1.6vw, 30px);
    font-size: clamp(14px, 1.1vw, 18px); font-weight: 600; flex: none; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: clamp(13px, 1vw, 15px); line-height: 1.5; }
  .results { margin-top: 18px; }
  .ritem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ritem img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--panel); flex: none; }
  .ritem .t { flex: 1; min-width: 0; }
  .ritem .t div:first-child { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ritem .t div:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ritem .add { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; flex: none;
    background: var(--fg); color: #000; line-height: 1; }
  .ritem .add:hover { transform: scale(1.06); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1c1c1c; border: 1px solid #2b2b2b;
    color: var(--fg); padding: 12px 20px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 86vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 10; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: #7a2b2b; }

  /* ---- Password prompt ---- */
  .pw { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 20; }
  .pw.show { display: grid; }
  .pwbox { background: #141414; border: 1px solid #2b2b2b; border-radius: 24px; padding: 32px; width: min(420px, 90vw);
    display: flex; flex-direction: column; gap: 14px; }
  .pwbox h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .pwbox p { color: var(--muted); font-size: 15px; }
  .pwbox input { background: #1c1c1c; border: 1px solid #2b2b2b; border-radius: 999px; padding: 14px 20px; font-size: 17px; outline: none; }
  .pwbox input:focus { border-color: #555; }
  .pwbox button { background: var(--fg); color: #000; border-radius: 999px; padding: 14px; font-size: 17px; font-weight: 600; }

  /* ---- Narrow windows: stack ---- */
  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; overflow-y: auto; height: 100vh; }
    .center { grid-column: 1 / -1; grid-row: 1; border-bottom: 1px solid var(--line); overflow: visible; padding-bottom: 18px; }
    .left { grid-row: 2; border-right: 1px solid var(--line); }
    .right { grid-row: 2; border-left: 0; }
    .col { overflow: visible; }
    html, body { overflow: auto; }
    .art { width: min(300px, 30vh, 60%); }
  }
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .center { grid-row: 1; }
    .right { grid-row: 2; border-left: 0; }
    .left { grid-row: 3; border-right: 0; border-top: 1px solid var(--line); }
    .output span:first-child { display: none; }
    .controls { gap: 22px; }
  }
  /* Short windows: shrink the art so the controls stay on screen. */
  @media (max-height: 760px) and (min-width: 1001px) {
    .art { width: min(445px, 30vh, 70%); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ---------------- Up next ---------------- -->
  <section class="col left">
    <h1>Up next</h1>
    <div class="qhead">
      <b id="qcount">Up next · 0 tracks</b>
      <button onclick="act('clear')">Clear</button>
    </div>
    <div id="queue"><p class="empty">Nothing queued. Search and tap + to add songs.</p></div>
  </section>

  <!-- ---------------- Player ---------------- -->
  <section class="col center">
    <div class="topbar">
      <div class="status" id="status"><i></i><span>Connecting…</span></div>
      <div class="output">
        <span>Output</span>
        <span class="select"><select id="channel"></select></span>
        <button class="join" onclick="joinChannel()">Join</button>
      </div>
    </div>

    <div class="art" id="art">
      <img id="artimg" alt="">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="title" id="title">Nothing playing</div>
    <div class="sub" id="sub">Search a song, then tap play.</div>

    <div class="bar" id="bar" onclick="seek(event)"><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="times"><span id="tl">0:00</span><span id="tr">0:00</span></div>

    <div class="controls">
      <button class="side" title="Back" onclick="act('back')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="play" id="play" title="Play / pause" onclick="togglePlay()">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l12-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="side" title="Skip" onclick="act('skip')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="pills">
      <button class="pill" onclick="act('shuffle')">Shuffle</button>
      <button class="pill" id="loop" onclick="cycleLoop()">Loop: off</button>
      <button class="pill" id="auto" onclick="toggleAutoplay()">Autoplay: on</button>
      <button class="pill" onclick="act('seek', {position: 0})">Replay</button>
      <button class="pill danger" onclick="act('stop')">Stop &amp; leave</button>
    </div>

    <div class="vol">
      <span>Volume</span>
      <input type="range" id="vol" min="0" max="200" value="100" oninput="volLabel()" onchange="setVol()">
      <b id="volv">100%</b>
    </div>
  </section>

  <!-- ---------------- Search ---------------- -->
  <section class="col right">
    <form class="search" onsubmit="search(); return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Song, artist or link" autocomplete="off" autofocus>
      <button type="submit">Search</button>
    </form>
    <div class="srow">
      <span class="hint">Enter = search · + = add to queue</span>
      <button class="pill" onclick="playTop()">▶ Play now</button>
    </div>
    <div class="results" id="results"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<!-- Password prompt (only shown when the host set WEB_TOKEN). -->
<div class="pw" id="pw">
  <form class="pwbox" onsubmit="submitPassword(); return false;">
    <h2>MusicGang password</h2>
    <p id="pw-msg">This bot needs a password.</p>
    <input id="pw-input" type="password" placeholder="Password from the host" autocomplete="off">
    <button type="submit">Connect</button>
  </form>
</div>

<script>
  const API = "/api";
  let state = {};
  let draggingVol = false;
  let lastChannels = "";

  // ---- helpers ---------------------------------------------------------
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function fmt(ms) {
    if (!ms) return "0:00";
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
    const ss = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m % 60).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  }
  let toastTimer;
  function toast(msg, err) {
    const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", err ? 5000 : 2500);
  }
  // ---- password ---------------------------------------------------------
  // When the host sets WEB_TOKEN, every API call must carry it. Ask once,
  // remember it in localStorage, ask again if the host rejects it.
  let token = "";
  try { token = localStorage.getItem("musicgang_token") || ""; } catch (e) {}
  let askingForPassword = false;
  function askPassword(message) {
    if (askingForPassword) return;
    askingForPassword = true;
    $("pw-msg").textContent = message || "This bot needs a password.";
    $("pw").classList.add("show"); $("pw-input").value = ""; $("pw-input").focus();
  }
  function submitPassword() {
    token = $("pw-input").value.trim();
    try { localStorage.setItem("musicgang_token", token); } catch (e) {}
    $("pw").classList.remove("show"); askingForPassword = false;
    poll();
  }
  async function api(path, body) {
    const headers = {"X-MusicGang-Token": token};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const r = await fetch(`${API}/${path}`, body === undefined ? {headers} : {
      method: "POST", headers, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { askPassword(token ? "Wrong password — try again." : "This bot needs a password."); throw new Error("Password needed"); }
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  }
  async function act(name, body) {
    try { render(await api(name, body || {})); }
    catch (e) { toast(e.message, true); }
  }

  // ---- render ----------------------------------------------------------
  function setStatus(text, cls) {
    const el = $("status"); el.className = "status " + (cls || ""); el.querySelector("span").textContent = text;
  }
  function render(s) {
    state = s;
    if (!s.lavalink) setStatus("Lavalink (audio server) is not running", "bad");
    else if (s.connected) setStatus(`In ${s.channel}`, "on");
    else setStatus("Not in a voice channel — Play joins the busiest one", "");

    const cur = s.current;
    if (cur) {
      $("title").textContent = cur.title;
      $("sub").textContent = `${cur.author || "Unknown"} · ${cur.requester}`;
      if (cur.artwork) { if ($("artimg").src !== cur.artwork) $("artimg").src = cur.artwork; $("art").classList.add("has"); }
      else $("art").classList.remove("has");
      const len = cur.length || 0, pos = Math.min(s.position || 0, len || Infinity);
      $("fill").style.width = len ? (100 * pos / len) + "%" : "0%";
      $("tl").textContent = fmt(pos); $("tr").textContent = len ? fmt(len) : "LIVE";
    } else {
      $("title").textContent = "Nothing playing";
      $("sub").textContent = "Search a song, then tap play.";
      $("art").classList.remove("has");
      $("fill").style.width = "0%"; $("tl").textContent = "0:00"; $("tr").textContent = "0:00";
    }
    const playing = cur && !s.paused;
    $("icon-play").style.display = playing ? "none" : "";
    $("icon-pause").style.display = playing ? "" : "none";

    $("loop").textContent = "Loop: " + (s.loop || "off");
    $("loop").classList.toggle("on", !!s.loop && s.loop !== "off");
    const auto = s.autoplay === "enabled";
    $("auto").textContent = "Autoplay: " + (auto ? "on" : s.autoplay === "partial" ? "partial" : "off");
    $("auto").classList.toggle("on", auto);

    if (!draggingVol) { $("vol").value = s.volume ?? 100; $("volv").textContent = (s.volume ?? 100) + "%"; }

    // Queue.
    const q = s.queue || [];
    $("qcount").textContent = `Up next · ${q.length} track${q.length === 1 ? "" : "s"}`;
    $("queue").innerHTML = q.length ? q.map((t, i) => `
      <div class="qitem">
        <span class="n">${i + 1}</span>
        <img src="${esc(t.artwork || "")}" onerror="this.style.visibility='hidden'">
        <div class="t"><div>${esc(t.title)}</div><div>${esc(t.author || "")} · ${esc(t.requester)}</div></div>
        <span class="d">${fmt(t.length)}</span>
        <button class="x" title="Remove" onclick="act('remove', {index: ${i}})">×</button>
      </div>`).join("") : `<p class="empty">Nothing queued. Search and tap + to add songs.</p>`;

    // Output (voice channel) dropdown — rebuild only when the list changes.
    const chans = s.channels || [];
    const key = JSON.stringify(chans) + (s.channel_id || "");
    if (key !== lastChannels) {
      lastChannels = key;
      const sel = $("channel");
      sel.innerHTML = chans.map(c => `<option value="${c.id}">${esc(c.name)}${c.humans ? ` (${c.humans})` : ""}</option>`).join("")
        || `<option value="">No voice channels</option>`;
      if (s.channel_id) sel.value = s.channel_id;
      else if (chans.length) sel.value = chans.reduce((a, b) => b.humans > a.humans ? b : a).id;
    }
  }

  // ---- actions ---------------------------------------------------------
  function togglePlay() {
    if (!state.current) { playTop(); return; }
    act(state.paused ? "resume" : "pause");
  }
  function cycleLoop() {
    const next = {off: "track", track: "queue", queue: "off"}[state.loop || "off"];
    act("loop", {mode: next});
  }
  function toggleAutoplay() { act("autoplay", {mode: state.autoplay === "enabled" ? "disabled" : "enabled"}); }
  function seek(e) {
    if (!state.current || !state.current.length) return;
    const r = $("bar").getBoundingClientRect();
    act("seek", {position: Math.round(state.current.length * (e.clientX - r.left) / r.width)});
  }
  function volLabel() { draggingVol = true; $("volv").textContent = $("vol").value + "%"; }
  function setVol() { draggingVol = false; act("volume", {level: Number($("vol").value)}); }
  function joinChannel() { const id = $("channel").value; if (id) act("join", {channel_id: id}); }

  async function playQuery(query) {
    try { const d = await api("play", {query}); render(d.state); toast(d.message); }
    catch (e) { toast(e.message, true); }
  }
  // "Play now": top result of what's in the search box, or a pasted link/playlist.
  function playTop() {
    const q = $("q").value.trim();
    if (q) playQuery(q); else { $("q").focus(); toast("Type a song or paste a link first"); }
  }
  async function search() {
    const q = $("q").value.trim();
    if (!q) return;
    $("results").innerHTML = `<p class="hint">Searching…</p>`;
    try {
      const d = await api("search", {query: q});
      const tracks = d.tracks || [];
      // Queries go in data attributes (not inline onclick) because URLs can
      // contain quotes that would break the attribute string.
      let html = "";
      if (d.playlist) html += `
        <div class="ritem">
          <div class="t"><div>Playlist: ${esc(d.playlist.name)}</div><div>${d.playlist.count} tracks</div></div>
          <button class="add" title="Add all" data-q="${esc(q)}">+</button>
        </div>`;
      html += tracks.map(t => `
        <div class="ritem">
          <img src="${esc(t.artwork || "")}" onerror="this.style.visibility='hidden'">
          <div class="t"><div>${esc(t.title)}</div><div>${esc(t.author || "")} · ${fmt(t.length)}</div></div>
          <button class="add" title="Add to queue" data-q="${esc(t.uri || t.title)}">+</button>
        </div>`).join("");
      $("results").innerHTML = html || `<p class="hint">No results.</p>`;
    } catch (e) { $("results").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }
  $("results").addEventListener("click", e => {
    const b = e.target.closest("button[data-q]");
    if (b) playQuery(b.dataset.q);
  });

  // ---- polling ---------------------------------------------------------
  async function poll() {
    try { render(await api("state")); }
    catch (e) {
      if (e.message === "Password needed") setStatus("Waiting for the password…", "bad");
      else setStatus("Bot offline — start it with start.bat", "bad");
    }
  }
  poll(); setInterval(poll, 1000);
</script>
</body>
</html>
